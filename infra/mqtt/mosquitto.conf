# ============================================================
#  Mosquitto Configuration — Eclipse Mosquitto 2.x
# ============================================================

# Listener MQTT (porta 1883)
listener 1883
protocol mqtt

# Listener WebSocket (porta 9001)
listener 9001
protocol websockets

# Segurança básica
allow_anonymous false
password_file /mosquitto/config/passwordfile_local
acl_file /mosquitto/config/aclfile

# Persistência
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_type all
